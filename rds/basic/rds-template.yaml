AWSTemplateFormatVersion: '2010-09-09'
Description: RDS MySQL in Default VPC

Resources:

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow MySQL Access
      VpcId: vpc-0f26d23109fd9221f

      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp: 0.0.0.0/0

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Default subnet group
      SubnetIds:
        - subnet-07716f4d7009be5b4
        - subnet-05ddb002b27bd6f61

  MyRDS:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: my-rds

      Engine: mysql
      EngineVersion: "8.4.8"

      DBInstanceClass: db.t3.micro
      AllocatedStorage: 20

      MasterUsername: admin
      MasterUserPassword: Password123!

      StorageType: gp3
      StorageEncrypted: true

      PubliclyAccessible: true
      MultiAZ: false
      BackupRetentionPeriod: 7
      DeletionProtection: false

      DBSubnetGroupName: !Ref DBSubnetGroup

      VPCSecurityGroups:
        - !GetAtt RDSSecurityGroup.GroupId

Outputs:

  Endpoint:
    Value: !GetAtt MyRDS.Endpoint.Address

  Port:
    Value: !GetAtt MyRDS.Endpoint.Port